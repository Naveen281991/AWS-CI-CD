version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    REPOSITORY_URI: 407036964001.dkr.ecr.us-east-1.amazonaws.com/cicd-repo-01
    IMAGE_TAG: latest

phases:

  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 407036964001.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build started...

      - mvn clean install

      - echo Building Docker image...

      - docker build -t cicd-repo-01 .

      - echo Listing Docker images...

      - docker images

      - echo Tagging Docker image...

      - docker tag cicd-repo-01:latest $REPOSITORY_URI:$IMAGE_TAG

      - docker images

  post_build:
    commands:
      - echo Pushing Docker image...

      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo Build completed successfully

artifacts:
  files:
    - target/*.jar